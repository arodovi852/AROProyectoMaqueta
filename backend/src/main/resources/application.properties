# Server Configuration
server.port=8080

# TMDB API Configuration
# Get your API key at: https://developer.themoviedb.org/
tmdb.api.key=YOUR_TMDB_API_KEY
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base-url=https://image.tmdb.org/t/p/w500

# CORS Configuration
cors.allowed-origins=http://localhost:4200,http://localhost:3000

# Logging
logging.level.com.aroproyecto=DEBUG
logging.level.org.springframework.web=INFO

# Mock Mode (si es true, usa datos mockeados en lugar de la API real)
api.mock-mode=true
