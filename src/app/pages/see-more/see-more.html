<!-- See More Page -->
<div class="see-more-page">
  <!-- Header -->
  <header class="see-more-page__header">
    <button class="see-more-page__back" (click)="goBack()" aria-label="Go back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Back
    </button>
    <h1 class="see-more-page__title">{{ pageTitle() }}</h1>
  </header>

  <!-- Series Grid -->
  <section class="see-more-page__content">
    <div class="see-more-page__grid">
      @for (item of series(); track item.id) {
        <div class="see-more-page__item">
          <app-card
            [imageSrc]="item.imageSrc"
            [imageAlt]="item.title"
            [hoverTitle]="item.title"
            [seriesId]="item.id"
            variant="media"
            class="see-more-page__card"
          />
          @if (section() === 'recently-watched') {
            <div class="see-more-page__info">
              <span class="see-more-page__series-title">{{ item.title }}</span>
              @if (item.rating) {
                <span class="see-more-page__rating">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                  </svg>
                  {{ item.rating }}
                </span>
              }
            </div>
          }
        </div>
      }
    </div>

    @if (series().length === 0) {
      <div class="see-more-page__empty">
        <p>No series found for this section.</p>
      </div>
    }
  </section>
</div>
