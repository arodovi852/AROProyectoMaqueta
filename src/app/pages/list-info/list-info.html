<!-- Create List Page -->
<div class="list-info-page">
  <div class="list-info-page__container">
    <!-- Page title -->
    <h1 class="list-info-page__title">Create list</h1>

    <!-- Form -->
    <form class="list-info-form" (ngSubmit)="onCreateList()">
      <!-- Section: Title -->
      <div class="list-info-form__field list-info-form__field--title">
        <app-form-input
          label="Title"
          name="title"
          placeholder=""
          (valueChange)="onTitleChange($event)"
        />
      </div>

      <!-- Section: Description -->
      <div class="list-info-form__field list-info-form__field--description">
        <app-form-textarea
          label="Description"
          name="description"
          [rows]="6"
          placeholder=""
          (valueChange)="onDescriptionChange($event)"
        />
      </div>

      <!-- Section: Add game -->
      <div class="list-info-form__field list-info-form__field--add-game">
        <app-form-input
          label="Add game"
          name="addGame"
          placeholder=""
          (valueChange)="onAddGameChange($event)"
        />
      </div>

      <!-- Section: Public checkbox -->
      <div class="list-info-form__field list-info-form__field--checkbox">
        <app-form-checkbox
          label="Public?"
          name="isPublic"
          (valueChange)="onPublicChange($event)"
        />
      </div>

      <!-- Create list button -->
      <div class="list-info-form__actions">
        <app-button 
          type="submit" 
          variant="secondary"
          text="Create list"
        />
      </div>
    </form>
  </div>
</div>
