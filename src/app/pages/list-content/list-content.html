<!-- List Content Page -->
<div class="list-content-page">
  <!-- Banner with responsive images -->
  <div class="list-content-page__banner">
    <app-responsive-banner
      [imageSrc]="bannerImage()"
      [alt]="listName()"
    />
    <div class="list-content-page__banner-overlay">
      <h1 class="list-content-page__banner-title">{{ listName() }}</h1>
    </div>
  </div>

  <!-- Main content -->
  <div class="list-content-page__content">
    <!-- Left column: Series in the list -->
    <div class="list-content-page__series">
      <div class="list-content-page__series-grid">
        @for (item of series(); track item.id) {
          <app-card
            [imageSrc]="item.imageSrc"
            [imageAlt]="item.title"
            [hoverTitle]="item.title"
            [seriesId]="item.id"
            variant="media"
            class="list-content-page__series-card"
          />
        }
      </div>
    </div>

    <!-- Right column: CardStatReview -->
    <div class="list-content-page__sidebar">
      <app-card-stat-review
        [statsBars]="statsBars"
        [rating]="listRating()"
        [isWatchLater]="isSaved()"
        buttonText="Save list"
        (ratingChange)="onRatingChange($event)"
        (watchLaterToggle)="onSaveListToggle($event)"
      />
    </div>
  </div>
</div>
