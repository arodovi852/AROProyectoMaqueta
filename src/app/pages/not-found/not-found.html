<section class="not-found">
  <div class="not-found__container">
    <div class="not-found__content">
      <!-- Animated error code -->
      <div class="not-found__code">
        <span class="digit">4</span>
        <span class="digit zero">0</span>
        <span class="digit">4</span>
      </div>
      
      <h1 class="not-found__title">Page not found</h1>
      
      <p class="not-found__description">
        Sorry, the page you are looking for does not exist or has been moved.
        Please check the URL or go back to the home page.
      </p>
      
      <!-- Actions -->
      <div class="not-found__actions">
        <a routerLink="/" class="btn btn--primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn__icon">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Back to home
        </a>
        
        <a routerLink="/productos" class="btn btn--secondary">
          View products
        </a>
        
        <a routerLink="/contacto" class="btn btn--ghost">
          Contact support
        </a>
      </div>

      <!-- Useful links -->
      <nav class="not-found__links">
        <h2 class="not-found__links-title">Useful links</h2>
        <ul class="not-found__links-list">
          <li><a routerLink="/">Home</a></li>
          <li><a routerLink="/productos">Products</a></li>
          <li><a routerLink="/about">About us</a></li>
          <li><a routerLink="/contacto">Contact</a></li>
        </ul>
      </nav>
    </div>
  </div>
</section>
