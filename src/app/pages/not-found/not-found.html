<section class="not-found">
  <div class="not-found__container">
    <div class="not-found__content">
      <!-- Código de error animado -->

        <span class="digit">4</span>
        <span class="digit zero">0</span>
        <span class="digit">4</span>
      </div>
      
      <h1 class="not-found__title">Página no encontrada</h1>

        <a routerLink="/productos" class="btn btn--secondary">
          Ver productos
        </a>
        
        <a routerLink="/contacto" class="btn btn--ghost">
          Contactar soporte
        </a>
      </div>

      <!-- Enlaces útiles -->
      <nav class="not-found__links">
        <h2 class="not-found__links-title">Enlaces útiles</h2>
        <ul class="not-found__links-list">
          <li><a routerLink="/">Inicio</a></li>
          <li><a routerLink="/productos">Productos</a></li>
          <li><a routerLink="/about">Sobre nosotros</a></li>
          <li><a routerLink="/contacto">Contacto</a></li>
        </ul>
