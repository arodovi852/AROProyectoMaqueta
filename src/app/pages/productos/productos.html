<div class="productos">
  <div class="productos__container">
    <header class="productos__header">
      <h1 class="productos__title">Nuestros Productos</h1>
      <p class="productos__description">
        Soluciones tecnológicas diseñadas para impulsar tu negocio
      </p>
    </header>

    <div class="productos__grid">
      @for (producto of productos; track producto.id) {
        <article class="productos__card">
          <div class="productos__card-header" [style.background-color]="producto.color">
            <div class="productos__card-icon" [innerHTML]="producto.icon"></div>
          </div>
          <div class="productos__card-body">
            <h3 class="productos__card-title">{{ producto.nombre }}</h3>
            <p class="productos__card-description">{{ producto.descripcion }}</p>
            <ul class="productos__features">
              @for (feature of producto.features; track $index) {
                <li class="productos__feature">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
                    <path d="M13 4L6 11L3 8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  {{ feature }}
                </li>
              }
            </ul>
            <button class="productos__button">
              Más información
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
                <path d="M3 8h10m0 0l-4-4m4 4l-4 4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </article>
      }
    </div>
  </div>
</div>
