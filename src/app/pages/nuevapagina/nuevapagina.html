<div class="nueva-pagina">
    <section class="nueva-pagina__section">
        <div class="nueva-pagina__header">
            <h2 class="nueva-pagina__title"> List of Favorites</h2>
            <button class="nueva-pagina__see-more"> See more</button>
        </div>
        <div class="nueva-pagina__grid">
            <div class="nueva-pagina__columna">
                <section class="nueva-pagina__grid--section">
                    <app-card
                        [imageSrc]="'/assets/Images_For_Card_1.jpg'"
                        [imageAlt]="'Twin Peaks'"
                        [hoverTitle]="'Twin Peaks'"
                        [seriesId]="1"
                        variant="media"
                        role="listitem"></app-card>
                </section>
                
                <section class="nueva-pagina__grid--section">
                    <app-card
                        [imageSrc]="'/assets/Images_For_Card_2.jpg'"
                        [imageAlt]="'Stranger Things'"
                        [hoverTitle]="'Stranger Things'"
                        [seriesId]="2"
                        variant="media"
                        role="listitem"></app-card>
                </section>
                
                <section class="nueva-pagina__grid--section">
                    <app-card
                        [imageSrc]="'/assets/Images_For_Card_3.jpg'"
                        [imageAlt]="'Alien: Earth'"
                        [hoverTitle]="'Alien: Earth'"
                        [seriesId]="3"
                        variant="media"
                        role="listitem"></app-card>
                </section>

            </div>

            
            <div class="nueva-pagina__columna">
                    <componente-hijo [texto]="'Twin Peaks'" class="nueva-pagina__grid--section"></componente-hijo>
                    <componente-hijo [texto]="'Stranger Things'" class="nueva-pagina__grid--section"></componente-hijo>
                    <componente-hijo [texto]="'Alien Earth'" class="nueva-pagina__grid--section"></componente-hijo>
            </div>

            
             <div class="nueva-pagina__columna">
                    <componente-hijo [texto]="'Elemento 1'" class="nueva-pagina__grid--small"></componente-hijo>
                    <componente-hijo [texto]="'Elemento 2'" class="nueva-pagina__grid--small"></componente-hijo>
                    <componente-hijo [texto]="'Elemento 3'" class="nueva-pagina__grid--small"></componente-hijo>
        
            </div>
        </div>

    </section>-
</div>
