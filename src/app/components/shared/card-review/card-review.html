<!-- Card Review Component -->
<div 
  class="card-review" 
  [class.card-review--clickable]="clickable"
  [attr.role]="clickable ? 'button' : null"
  [attr.tabindex]="clickable ? 0 : null"
  [attr.aria-label]="clickable ? 'View ' + username + '\'s profile' : null"
  (click)="onCardClick()"
  (keydown)="onKeydown($event)"
>
  <!-- Avatar usando CardProfile -->
  <div class="card-review__avatar">
    <app-card-profile size="sm" />
  </div>

  <!-- Content -->
  <div class="card-review__content">
    <!-- Header: Username + Stars -->
    <div class="card-review__header">
      <span class="card-review__username">{{ username }}</span>
      <div class="card-review__stars">
        @for (star of stars; track $index) {
          <svg 
            class="card-review__star" 
            [class.card-review__star--filled]="star === 1"
            width="14" 
            height="14" 
            viewBox="0 0 24 24" 
            fill="currentColor"
          >
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        }
      </div>
    </div>

    <!-- Review Text -->
    <p class="card-review__text">{{ reviewText }}</p>
  </div>
</div>
