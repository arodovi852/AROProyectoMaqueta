<div class="dom-demo">
  <div class="dom-demo__header">
    <h3 class="dom-demo__title">DOM Manipulation Demonstration</h3>
    <p class="dom-demo__description">
      ViewChild, ElementRef and Renderer2 in action
    </p>
  </div>

  <div class="dom-demo__section">
    <h4>Modify Styles and Properties</h4>
    <div #contentDiv class="dom-demo__content">
      Initial DOM content
    </div>
    
    <div class="dom-demo__controls">
      <app-button variant="primary" size="sm" (onClick)="changeStyles()">
        Change Styles
      </app-button>
      <app-button variant="secondary" size="sm" (onClick)="changeContent()">
        Change Content
      </app-button>
      <app-button variant="ghost" size="sm" (onClick)="resetElement()">
        Reset
      </app-button>
      <app-button variant="primary" size="sm" (onClick)="addCssClass()">
        Add Class
      </app-button>
      <app-button variant="secondary" size="sm" (onClick)="removeCssClass()">
        Remove Class
      </app-button>
    </div>
  </div>

  <div class="dom-demo__section">
    <h4>Create and Remove Elements</h4>
    <div #dynamicContainer class="dom-demo__container"></div>
    
    <div class="dom-demo__controls">
      <app-button variant="primary" size="sm" (onClick)="createElement()">
        Create Element
      </app-button>
      <app-button variant="danger" size="sm" (onClick)="removeElement()">
        Remove Last
      </app-button>
      <app-button variant="ghost" size="sm" (onClick)="clearAll()">
        Clear All
      </app-button>
    </div>
  </div>
</div>
