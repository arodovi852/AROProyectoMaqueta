<!-- Card Data Component -->
<div class="card-data">
  <div class="card-data__row card-data__row--watched">
    <span class="card-data__label">Watched:</span>
    <span class="card-data__value">{{ watched }}</span>
  </div>
  <div class="card-data__row card-data__row--saved">
    <span class="card-data__label">Saved:</span>
    <span class="card-data__value">{{ saved }}</span>
  </div>
  <div class="card-data__row card-data__row--average">
    <span class="card-data__label">Average:</span>
    <span class="card-data__value">{{ average }}</span>
  </div>
</div>
