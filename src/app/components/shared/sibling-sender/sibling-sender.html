<div class="sibling-sender">
  <h3 class="sibling-sender__title">Sender Component</h3>
  <p class="sibling-sender__description">
    Send messages to the receiver component using CommunicationService
  </p>
  <app-button 
    variant="primary" 
    size="md" 
    (onClick)="sendMessage()">
    Send message
  </app-button>
  <p class="sibling-sender__counter">Messages sent: {{ messageCount }}</p>
</div>
