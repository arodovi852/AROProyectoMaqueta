<div [class]="cardClasses">
  @if (variant === 'rating') {
    <!-- Variante Rating: Series/Películas con estadísticas -->
    <div class="card__stats">
      @for (barValue of statBars; track $index) {
        <app-stat-bar [value]="barValue"></app-stat-bar>
      }
    </div>
    
    <div class="card__rating-footer">
      <div class="card__stars">
        @for (star of [].constructor(totalStars); track $index) {
          <app-star 
            [filled]="$index < filledStars"
            [hoverFill]="getStarHoverFill($index)"
            (hoverChange)="onStarHover($index, $event)"
          ></app-star>
        }
      </div>
      
      <app-watch-later></app-watch-later>
    </div>
  } @else {
    <!-- Otras variantes -->
    <!-- Imagen (opcional) -->
    @if (imageSrc) {
      <div class="card__image-wrapper">
        <img 
          [src]="imageSrc" 
          [alt]="imageAlt" 
          class="card__image"
          loading="lazy"
        >
        
        <!-- Logo text sobre la imagen -->
        @if (logoText) {
          <div class="card__logo-text">{{ logoText }}</div>
        }
        
        <!-- Overlay oscuro en hover -->
        <div class="card__overlay"></div>
        
        <!-- Título que aparece en hover -->
        @if (hoverTitle) {
          <div class="card__hover-title">{{ hoverTitle }}</div>
        }
      </div>
    }

    <!-- Contenido principal -->
    <div class="card__body">
      <!-- Título (opcional) -->
      @if (title) {
        <h3 class="card__title">{{ title }}</h3>
      }

      <!-- Contenido proyectado -->
      <div class="card__content">
        <ng-content></ng-content>
      </div>
    </div>

    <!-- Footer (opcional) -->
    @if (hasFooter) {
      <div class="card__footer">
        <ng-content select="[card-footer]"></ng-content>
      </div>
    }
  }
</div>
