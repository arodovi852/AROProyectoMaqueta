<!-- Card Stat Review Component -->
<div class="card-stat-review">
  <!-- Sección superior: Barras de estadísticas -->
  <div class="card-stat-review__stats">
    <div class="card-stat-review__bars">
      @for (bar of statsBars; track $index) {
        <app-stat-bar [value]="bar" />
      }
    </div>
  </div>

  <!-- Sección inferior: Rating y Watch Later -->
  <div class="card-stat-review__actions">
    <!-- Estrellas de valoración con soporte para media estrella -->
    <div class="card-stat-review__rating" (mouseleave)="onStarMouseLeave()">
      @for (star of stars; track star) {
        <button 
          class="card-stat-review__star"
          [class.card-stat-review__star--filled]="getStarFill(star) > 0"
          [class.card-stat-review__star--half]="getStarFill(star) === 50"
          [class.card-stat-review__star--hovered]="isStarHovered(star)"
          (click)="onStarClick($event, star)"
          (mousemove)="onStarMouseMove($event, star)"
          [attr.aria-label]="'Rate ' + star + ' stars'"
        >
          <!-- Background star (empty) -->
          <svg class="card-stat-review__star-bg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          <!-- Foreground star (filled with clip-path for half) -->
          <svg 
            class="card-stat-review__star-fill" 
            width="20" 
            height="20" 
            viewBox="0 0 24 24" 
            fill="currentColor"
            [style.clip-path]="'inset(0 ' + (100 - getStarFill(star)) + '% 0 0)'"
          >
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </button>
      }
    </div>

    <!-- Watch Later -->
    <button 
      class="card-stat-review__watch-later"
      [class.card-stat-review__watch-later--active]="isWatchLater"
      (click)="toggleWatchLater()"
      [attr.aria-label]="buttonText"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span>{{ buttonText }}</span>
    </button>
  </div>
</div>
