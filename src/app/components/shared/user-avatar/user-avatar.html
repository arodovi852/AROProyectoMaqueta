<!-- User Avatar Component -->
<div class="user-avatar" [class]="'user-avatar--' + size">
  <div class="user-avatar__image">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="user-avatar__icon">
      <circle cx="50" cy="50" r="48" fill="#6b5b7a" stroke="#8a7a9a" stroke-width="4"/>
      <circle cx="50" cy="38" r="16" fill="#f5f0e8"/>
      <path d="M20 85c0-16.569 13.431-30 30-30s30 13.431 30 30" fill="#f5f0e8"/>
    </svg>
  </div>
  <span class="user-avatar__name">{{ username }}</span>
</div>
