<div class="hamburger-demo">
  <div class="hamburger-demo__header">
    <h3 class="hamburger-demo__title">Hamburger Menu</h3>
    <p class="hamburger-demo__description">
      Toggle with close on click outside
    </p>
  </div>

  <div class="hamburger-menu">
    <!-- Hamburger button -->
    <button 
      class="hamburger-menu__button"
      [class.hamburger-menu__button--active]="isOpen"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
      aria-expanded="{{ isOpen }}"
    >
      <span class="hamburger-menu__line"></span>
      <span class="hamburger-menu__line"></span>
      <span class="hamburger-menu__line"></span>
    </button>

    <!-- Dropdown menu -->
    <nav 
      class="hamburger-menu__nav"
      [class.hamburger-menu__nav--open]="isOpen"
      (click)="onMenuClick($event)"
    >
      <ul class="hamburger-menu__list">
        <li class="hamburger-menu__item">
          <a routerLink="/" class="hamburger-menu__link" (click)="closeMenu()">
            Home
          </a>
        </li>
        <li class="hamburger-menu__item">
          <a routerLink="/productos" class="hamburger-menu__link" (click)="closeMenu()">
            Products
          </a>
        </li>
        <li class="hamburger-menu__item">
          <a routerLink="/about" class="hamburger-menu__link" (click)="closeMenu()">
            About
          </a>
        </li>
        <li class="hamburger-menu__item">
          <a routerLink="/contact" class="hamburger-menu__link" (click)="closeMenu()">
            Contact
          </a>
        </li>
        <li class="hamburger-menu__item">
          <a routerLink="/profile" class="hamburger-menu__link" (click)="closeMenu()">
            Settings
          </a>
        </li>
      </ul>
    </nav>

    <!-- Overlay -->
    <div 
      class="hamburger-menu__overlay"
      [class.hamburger-menu__overlay--visible]="isOpen"
      (click)="closeMenu()"
    ></div>
  </div>

  <div class="hamburger-demo__info">
    <p>Menu status: <strong>{{ isOpen ? 'Open' : 'Closed' }}</strong></p>
    <p class="hamburger-demo__hint">
      Click outside the menu to close it
    </p>
  </div>
</div>
