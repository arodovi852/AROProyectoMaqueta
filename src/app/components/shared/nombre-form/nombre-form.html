<div class="contact-form">
  <div class="contact-form__header">
    <h2 class="contact-form__title">Contact Us</h2>
    <p class="contact-form__description">
      Fill out the form and we will get in touch with you as soon as possible.
    </p>
  </div>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form__form">
    <!-- Section: Personal Information -->
    <fieldset class="contact-form__fieldset">
      <legend class="contact-form__legend">Personal Information</legend>

      <div class="contact-form__row">
        <!-- Name -->
        <div class="contact-form__field">
          <app-form-input
            inputId="contact-name"
            name="name"
            label="Full name"
            placeholder="Ex: John Doe"
            [required]="true"
            [showError]="isFieldInvalid('name')"
            [errorMessage]="getErrorMessage('name')"
            formControlName="name"
          ></app-form-input>
        </div>

        <!-- Email -->
        <div class="contact-form__field">
          <app-form-input
            inputId="contact-email"
            name="email"
            type="email"
            label="Email"
            placeholder="your@email.com"
            [required]="true"
            [showError]="isFieldInvalid('email')"
            [errorMessage]="getErrorMessage('email')"
            formControlName="email"
          ></app-form-input>
        </div>
      </div>

      <div class="contact-form__row">
        <!-- Phone -->
        <div class="contact-form__field">
          <app-form-input
            inputId="contact-phone"
            name="phone"
            type="tel"
            label="Phone"
            placeholder="+1 555 000 000"
            helpText="Optional: include country code"
            formControlName="phone"
          ></app-form-input>
        </div>

        <!-- Company -->
        <div class="contact-form__field">
          <app-form-input
            inputId="contact-company"
            name="company"
            label="Company"
            placeholder="Your company name"
            helpText="Optional"
            formControlName="company"
          ></app-form-input>
        </div>
      </div>
    </fieldset>

    <!-- Section: Contact Reason -->
    <fieldset class="contact-form__fieldset">
      <legend class="contact-form__legend">Contact Reason</legend>

      <!-- Subject -->
      <div class="contact-form__field">
        <app-form-select
          selectId="contact-subject"
          name="subject"
          label="Subject"
          placeholder="Select a subject"
          [required]="true"
          [options]="subjectOptions"
          [showError]="isFieldInvalid('subject')"
          [errorMessage]="getErrorMessage('subject')"
          formControlName="subject"
        ></app-form-select>
      </div>

      <!-- Message -->
      <div class="contact-form__field">
        <app-form-textarea
          textareaId="contact-message"
          name="message"
          label="Message"
          placeholder="Write your message here..."
          [required]="true"
          [rows]="6"
          [maxLength]="1000"
          [showCharacterCount]="true"
          helpText="Please provide all relevant details"
          [showError]="isFieldInvalid('message')"
          [errorMessage]="getErrorMessage('message')"
          formControlName="message"
        ></app-form-textarea>
      </div>
    </fieldset>

    <!-- Section: Consents -->
    <fieldset class="contact-form__fieldset">
      <legend class="contact-form__legend">Consents</legend>

      <!-- Privacy Policy -->
      <div class="contact-form__field">
        <app-form-checkbox
          checkboxId="contact-privacy"
          name="privacy"
          [label]="'I accept the privacy policy'"
          [required]="true"
          [showError]="isFieldInvalid('privacy')"
          errorMessage="You must accept the privacy policy to continue"
          formControlName="privacy"
        ></app-form-checkbox>
      </div>

      <!-- Newsletter -->
      <div class="contact-form__field">
        <app-form-checkbox
          checkboxId="contact-newsletter"
          name="newsletter"
          [label]="'I want to receive news and updates by email'"
          helpText="You can unsubscribe at any time"
          formControlName="newsletter"
        ></app-form-checkbox>
      </div>
    </fieldset>

    <!-- Success message -->
    <div *ngIf="submitted && contactForm.valid" class="contact-form__success" role="alert">
      <svg class="contact-form__success-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h3 class="contact-form__success-title">Message sent successfully!</h3>
        <p class="contact-form__success-message">Thank you for contacting us. We will respond soon.</p>
      </div>
    </div>

    <!-- General error message -->
    <div *ngIf="submitted && contactForm.invalid" class="contact-form__error-banner" role="alert">
      <svg class="contact-form__error-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
      </svg>
      Please correct the errors before submitting the form.
    </div>

    <!-- Action buttons -->
    <div class="contact-form__actions">
      <button 
        type="button" 
        (click)="onReset()" 
        class="contact-form__button contact-form__button--secondary"
        [disabled]="isSubmitting"
      >
        Clear
      </button>
      <button 
        type="submit" 
        class="contact-form__button contact-form__button--primary"
        [disabled]="isSubmitting"
      >
        <span *ngIf="!isSubmitting">Send Message</span>
        <span *ngIf="isSubmitting" class="contact-form__loading">
          <svg class="contact-form__spinner" width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2" opacity="0.25"/>
            <path d="M10 2a8 8 0 018 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Sending...
        </span>
      </button>
    </div>
  </form>
</div>
