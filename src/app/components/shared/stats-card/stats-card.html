<!-- Stats Card Component -->
<div class="stats-card">
  <div class="stats-card__item">
    <span class="stats-card__label">Watched:</span>
    <span class="stats-card__value stats-card__value--watched">{{ watched }}</span>
  </div>
  <div class="stats-card__item">
    <span class="stats-card__label">Saved:</span>
    <span class="stats-card__value stats-card__value--saved">{{ saved }}</span>
  </div>
  <div class="stats-card__item">
    <span class="stats-card__label">Average:</span>
    <span class="stats-card__value stats-card__value--average">{{ average }}</span>
  </div>
</div>
