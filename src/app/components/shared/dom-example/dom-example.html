<div class="dom-example">
  <h3 class="dom-example__title">DOM Manipulation Examples</h3>
  
  <!-- Section 1: Modify styles and properties -->
  <section class="dom-example__section">
    <h4>1. Modify Styles and Properties</h4>
    <div #miDiv class="demo-div">Initial content</div>
    
    <div class="dom-example__buttons">
      <button 
        type="button" 
        class="dom-example__btn"
        (click)="cambiarEstilo()"
      >
        Change Style
      </button>
      <button 
        type="button" 
        class="dom-example__btn"
        (click)="cambiarPropiedad()"
      >
        Change Text
      </button>
      <button 
        type="button" 
        class="dom-example__btn"
        (click)="agregarClase()"
      >
        Add Class
      </button>
      <button 
        type="button" 
        class="dom-example__btn"
        (click)="quitarClase()"
      >
        Remove Class
      </button>
    </div>
  </section>

  <!-- Section 2: Create and remove elements -->
  <section class="dom-example__section">
    <h4>2. Create and Remove Elements</h4>
    <p class="dom-example__description">
      Elements created: <strong>{{ elementCount }}</strong>
    </p>
    
    <div class="dom-example__buttons">
      <button 
        type="button" 
        class="dom-example__btn dom-example__btn--primary"
        (click)="crearElemento()"
      >
        ➕ Create Element
      </button>
      <button 
        type="button" 
        class="dom-example__btn dom-example__btn--danger"
        (click)="eliminarPrimerElemento()"
        [disabled]="elementCount === 0"
      >
        Remove First
      </button>
      <button 
        type="button" 
        class="dom-example__btn dom-example__btn--danger"
        (click)="eliminarUltimoElemento()"
        [disabled]="elementCount === 0"
      >
        Remove Last
      </button>
      <button 
        type="button" 
        class="dom-example__btn dom-example__btn--danger"
        (click)="eliminarTodos()"
        [disabled]="elementCount === 0"
      >
        Remove All
      </button>
    </div>

    <!-- Container for dynamic elements -->
    <div 
      #contenedor 
      class="dom-example__container"
      role="list"
      aria-label="List of dynamically created elements"
    >
      <!-- Elements will be created here dynamically -->
    </div>
  </section>
</div>
