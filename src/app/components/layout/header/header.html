<header class="header">
  <div class="header__container">
    <!-- Logo -->
    <a routerLink="/" class="header__logo" aria-label="Ir a la página principal">
      <span class="header__logo-text">BROADCASTTD</span>
    </a>

    <!-- Botón hamburguesa (solo mobile) -->
    <button
      #toggleBtn
      type="button"
      class="header__toggle"
      [class.header__toggle--active]="isMenuOpen"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Menú"
    >
      <span class="header__toggle-bar"></span>
      <span class="header__toggle-bar"></span>
      <span class="header__toggle-bar"></span>
    </button>

    <!-- Botones y búsqueda -->
    <div class="header__actions">
      <!-- Botón Theme Toggle -->
      <app-theme-toggle class="header__theme-toggle" />
      
      <!-- Botones Log In/User o Log Out -->
      @if (currentUser()) {
        <span class="header__username">{{ currentUser()!.username }}</span>
        <app-button 
          text="Log Out"
          variant="secondary"
          size="md"
          class="header__btn header__btn--logout"
          (onClick)="logout()"
        />
      } @else {
        <app-button 
          text="Log In"
          variant="primary"
          size="md"
          class="header__btn header__btn--login"
          (onClick)="openAuthModal()"
        />
      }

      <!-- Botón Lists -->
      <a routerLink="/lists" class="header__btn-link">
        <app-button 
          text="Lists"
          variant="ghost"
          size="md"
          class="header__btn header__btn--lists"
        />
      </a>

      <!-- Campo de búsqueda -->
      <div class="header__search">
        <input 
          type="search" 
          class="header__search-input" 
          placeholder="Search" 
          aria-label="Buscar"
        />
        <button 
          type="submit" 
          class="header__search-btn" 
          aria-label="Buscar"
        >
          <svg class="header__search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="8" cy="8" r="6" stroke-width="2"/>
            <path d="M12.5 12.5L17 17" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Menú móvil desplegable -->
    <div 
      class="header__mobile-menu"
      [class.header__mobile-menu--open]="isMenuOpen"
    >
      @if (currentUser()) {
        <div class="header__mobile-user">
          <span class="header__mobile-username">{{ currentUser()!.username }}</span>
        </div>
        <button 
          type="button" 
          class="header__mobile-btn header__mobile-btn--logout" 
          aria-label="Cerrar sesión"
          (click)="logout()"
        >
          Log Out
        </button>
      } @else {
        <button 
          type="button" 
          class="header__mobile-btn header__mobile-btn--login" 
          aria-label="Iniciar sesión"
          (click)="openAuthModal()"
        >
          Log In
        </button>
      }

      <button 
        type="button" 
        class="header__mobile-btn header__mobile-btn--lists" 
        aria-label="Listas"
      >
        Lists
      </button>
    </div>
  </div>

  <!-- Modal de autenticación -->
  @if (showAuthModal()) {
    <app-auth-modal (close)="closeAuthModal()"></app-auth-modal>
  }
</header>
