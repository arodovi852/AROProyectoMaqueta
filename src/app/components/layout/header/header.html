<header class="header">
  <div class="header__container">
    <!-- Logo -->
    <a routerLink="/" class="header__logo" aria-label="Ir a la página principal">
      <svg class="header__logo-icon" width="32" height="32" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <path d="M16 2L2 9v14l14 7 14-7V9L16 2zm0 2.5L26.5 10 16 15.5 5.5 10 16 4.5zm-12 7l12 6v11l-12-6v-11zm14 17v-11l12-6v11l-12 6z"/>
      </svg>
      <span class="header__logo-text">BROADCAST</span>
    </a>

    <!-- Botón hamburguesa para móvil -->
    <button 
      type="button" 
      class="header__toggle" 
      aria-label="Abrir menú de navegación"
      aria-expanded="false"
      aria-controls="main-navigation"
      (click)="toggleMenu()"
    >
      <span class="header__toggle-bar"></span>
      <span class="header__toggle-bar"></span>
      <span class="header__toggle-bar"></span>
    </button>

    <!-- Navegación principal -->
    <nav id="main-navigation" class="header__nav" aria-label="Navegación principal">
      <ul class="header__nav-list">
        <li class="header__nav-item">
          <a 
            routerLink="/" 
            routerLinkActive="header__nav-link--active" 
            [routerLinkActiveOptions]="{exact: true}"
            class="header__nav-link" 
            (click)="closeMenu()"
          >
            Inicio
          </a>
        </li>
        <li class="header__nav-item">
          <a 
            routerLink="/productos" 
            routerLinkActive="header__nav-link--active"
            class="header__nav-link" 
            (click)="closeMenu()"
          >
            Productos
          </a>
        </li>
        <li class="header__nav-item">
          <a 
            routerLink="/contacto" 
            routerLinkActive="header__nav-link--active"
            class="header__nav-link" 
            (click)="closeMenu()"
          >
            Contacto
          </a>
        </li>
      </ul>
    </nav>

    <!-- Utilidades (búsqueda, usuario, carrito) -->
    <div class="header__utils">
      <!-- Búsqueda -->
      <button 
        type="button" 
        class="header__utils-btn" 
        aria-label="Abrir búsqueda"
      >
        <svg class="header__utils-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="8" cy="8" r="6" stroke-width="2"/>
          <path d="M12.5 12.5L17 17" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Usuario -->
      <button 
        type="button" 
        class="header__utils-btn" 
        aria-label="Cuenta de usuario"
      >
        <svg class="header__utils-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="10" cy="6" r="4" stroke-width="2"/>
          <path d="M3 18c0-4 3-7 7-7s7 3 7 7" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Carrito con badge -->
      <button 
        type="button" 
        class="header__utils-btn header__utils-btn--cart" 
        aria-label="Carrito de compras con 3 artículos"
      >
        <svg class="header__utils-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M1 1h3l2.68 13.39a2 2 0 0 0 2 1.61h8.64a2 2 0 0 0 2-1.61L21 6H6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9" cy="18" r="1" fill="currentColor"/>
          <circle cx="16" cy="18" r="1" fill="currentColor"/>
        </svg>
        <span class="header__utils-badge" aria-hidden="true">3</span>
      </button>
    </div>
  </div>
</header>
