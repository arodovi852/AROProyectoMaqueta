<section class="hero">
  <div class="hero__container">
    <div class="hero__content">
      <h1 class="hero__title">
        <span class="hero__title-highlight">Impulsa</span> tu negocio
        <br>
        hacia el futuro digital
      </h1>
      <p class="hero__description">
        Soluciones innovadoras de comunicación y tecnología diseñadas para transformar
        la forma en que tu empresa se conecta con el mundo.
      </p>
      <div class="hero__actions">
        <button class="hero__button hero__button--primary">
          Comenzar ahora
          <svg class="hero__button-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
            <path d="M5 10h10m0 0l-4-4m4 4l-4 4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="hero__button hero__button--secondary">
          Ver demo
        </button>
      </div>
      <!-- Estadísticas -->
      <div class="hero__stats">
        <div class="hero__stat">
          <div class="hero__stat-number">500+</div>
          <div class="hero__stat-label">Clientes</div>
        </div>
        <div class="hero__stat">
          <div class="hero__stat-number">98%</div>
          <div class="hero__stat-label">Satisfacción</div>
        </div>
        <div class="hero__stat">
          <div class="hero__stat-number">24/7</div>
          <div class="hero__stat-label">Soporte</div>
        </div>
      </div>
    </div>
    <div class="hero__visual">
      <div class="hero__image-wrapper">
        <svg class="hero__image" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Ilustración abstracta -->
          <circle cx="250" cy="250" r="200" fill="var(--color-primary-lightest)" opacity="0.3"/>
          <circle cx="250" cy="250" r="150" fill="var(--color-primary-light)" opacity="0.4"/>
          <circle cx="250" cy="250" r="100" fill="var(--color-primary)" opacity="0.6"/>
          <rect x="200" y="200" width="100" height="100" rx="10" fill="var(--color-secondary)" opacity="0.7"/>
          <path d="M250 150L300 250L250 350L200 250Z" fill="var(--color-primary-dark)" opacity="0.5"/>
        </svg>
      </div>
    </div>
  </div>
</section>
