# Configuración de Cloudflare Pages
# Este archivo se usa automáticamente cuando conectas tu repo a Cloudflare Pages

[build]
  command = "npm install --legacy-peer-deps && npm run build:prod"
  publish = "dist/aroproyecto-maqueta/browser"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
