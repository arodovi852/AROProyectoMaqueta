# Render Blueprint para AROProyectoMaqueta
# https://render.com

services:
  # Servicio Web (Static Site)
  - type: web
    name: aroproyecto-maqueta
    env: static
    buildCommand: npm install --legacy-peer-deps && npm run build:prod
    staticPublishPath: dist/AROProyectoMaqueta/browser/browser
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
