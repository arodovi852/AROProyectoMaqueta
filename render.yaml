# Render Blueprint para AROProyectoMaqueta
# https://render.com

services:
  # Servicio Web (Static Site) - Más rápido para Angular SPA
  - type: web
    name: aroproyecto-maqueta
    runtime: static
    buildCommand: npm ci && npm run build:prod
    staticPublishPath: ./dist/AROProyectoMaqueta/browser
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
