<div class="nueva-pagina">
    <section class="nueva-pagina__section">
        <div class="nueva-pagina__header">
            <h2 class="nueva-pagina__title"> List of Favorites</h2>
            <button class="nueva-pagina__see-more"> See more</button>
        </div>
        <div class="nueva-pagina__grid">
            @for (series of popularSeries; track series.id) {
          <app-card
            [imageSrc]="series.imageSrc"
            [imageAlt]="series.imageAlt"
            [hoverTitle]="series.hoverTitle"
            [seriesId]="series.id"
            variant="media"
            role="listitem"
          ></app-card>
        }
        </div>
    </section>
</div>
